<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Predictor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Placement Predictor</h1>

        <p>Enter student details to predict placement.</p>

        <form action="/predict" method="POST">

            <label>Study Hours</label>
            <input
                type="number"
                name="study_hours"
                step="0.1"
                min="0"
                required
            >

            <label>Attendance (%)</label>
            <input
                type="number"
                name="attendance"
                min="0"
                max="100"
                required
            >

            <label>Assignment Score (%)</label>
            <input
                type="number"
                name="assignment_score"
                min="0"
                max="100"
                required
            >

            <label>Internal Marks (%)</label>
            <input
                type="number"
                name="internal_marks"
                min="0"
                max="100"
                required
            >

            <label>Previous Percentage (%)</label>
            <input
                type="number"
                name="previous_percentage"
                min="0"
                max="100"
                required
            >

            <button type="submit">
                Predict Placement
            </button>

        </form>

        {% if prediction %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}

    </div>

</body>
</html>
